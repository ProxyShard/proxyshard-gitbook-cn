openapi: 3.0.3

info:
  title: "ShardX Browser; Automation API"
  version: "0.1.0"
  description: "ShardX 反检测浏览器的本地 HTTP 自动化 API：\n生成指纹、创建/启动/停止配置文件，获取\nChrome DevTools Protocol (CDP) WebSocket 端点，以便通过\nPuppeteer / Playwright 控制已启动的配置文件。\n\n## 绑定与生命周期\n服务器在启动器应用内部运行，仅监听 **127.0.0.1**，\n端口由 *Settings → Automation API* 指定（默认 **40325**）。\n外部主机**无法访问**。更改端口及启用/停用设置\n在重启应用后生效。\n\n## 身份验证\n除 `GET /health` 外，所有端点均需要 **Bearer JWT**（HS256，\n由启动器密钥签名）：\n\n    Authorization: Bearer <token>\n\n永久令牌显示于 *Settings → Automation API*（从那里复制）。\n**Regenerate token** 按钮会立即轮换签名密钥：新令牌即刻生效，\n所有旧令牌同时失效。没有单独的 API 密钥或令牌签发端点。\n令牌本身就是凭据。\n\n缺失/无效令牌 → 返回空响应体的 `401`。\n\n## 典型流程\n1. `GET /fingerprint/new/{platform}` → 完全唯一化的指纹\n   （随机 platform_version、考虑主机的 CPU/RAM、裁剪后的屏幕、\n   各向量噪音），**不**保存。\n2. 可选：编辑返回的 `fingerprint` 对象（例如启用\n   `noise.fonts.enabled`、设置 `webrtc`、调整 `navigator`）。\n3. `POST /profiles`（或 `POST /folders/{folder}/profiles`），将该对象\n   作为 `fingerprint` → 启动器**原样**保存\n   （create 不会重新随机化）。\n4. `POST /profiles/{id}/start` → 返回 CDP 端点；以\n   `browserWSEndpoint = cdp.web_socket_debugger_url` 方式连接。\n5. 完成后执行 `POST /profiles/{id}/stop`。\n\n## 代理与 QUIC/WebRTC\n**每次**启动（通过 UI 或 API）时，在浏览器启动之前，\n绑定代理会实时探测 UDP-relay（SOCKS5 UDP_ASSOCIATE）的支持情况。\n如果 UDP 可用，则启用 QUIC，WebRTC 通过代理 UDP relay 通信；\n如果不可用，则禁用 QUIC，WebRTC 强制切换为 TCP-only 模式，\n防止真实 IP 泄露。`auto` 模式下的时区、语言和地理位置字段\n也会在启动时通过代理实时解析。若在创建永久配置文件时传入\n`proxy`（字符串），代理将被添加到存储并完成全量测试；\n临时配置文件的代理以内联方式存储。\n\n## 临时配置文件\n`POST /profiles/temporary` 创建带 `temporary` 标志的配置文件：\n在 `GET /profiles` 和启动器界面中隐藏，浏览器关闭后**自动删除**\n（配置 + 数据文件夹）。若应用在配置文件打开时崩溃，\n将在下次启动时删除。\n\n## fingerprint 对象\n`GET /fingerprint/new*` 返回、创建端点接受的 `fingerprint`\n是启动器原生的 FingerprintConfig。该对象被原样传递，\n因此下方 schema 记录了常见的子对象，但刻意保持开放\n（`additionalProperties: true`）。\n\n## MCP 服务器\n独立的 **MCP**（Model Context Protocol）服务器允许 AI 客户端\n通过*此* API 控制启动器，并通过 CDP 控制配置文件的浏览器。\n这是一个独立的 Node 进程，**不**是本 HTTP API 的组成部分，\n也不由其托管。可直接从启动器下载\n（**Settings → MCP server → Download MCP server** 或侧边栏\"Download MCP\"按钮）；\n启动器会将源代码保存到所选文件夹。\n也可从仓库获取：`rust/shardx-launcher/mcp/`。\n\n其底层只是调用此 API：配置\n`SHARDX_API`（基础 URL）和 `SHARDX_TOKEN`（来自\n*Settings → Automation API* 的 Bearer 令牌）。MCP 服务器提供：\n- **API 工具，作为下方端点的轻量封装\n  （配置文件、指纹、代理、文件夹、cookies、启动/停止）。\n- **浏览器工具**（基于 CDP 的 patchright），`browser_navigate`、\n  `browser_evaluate`、`browser_screenshot`、`browser_click`、\n  `browser_fill`、标签页管理、等待操作等，作用于通过\n  `POST /profiles/{id}/start` 启动的配置文件（该端点返回\n  CDP 端点）。\n\n启动方式：通过 **stdio**（由客户端启动）或通过 HTTP\n在 `127.0.0.1:<port>/mcp`（若设置了 `MCP_HTTP_PORT`）。详情见\nMCP 服务器的 README。（启动器仅负责下载，不负责运行。）\n"
servers:
  - url: http://127.0.0.1:40325
    description: 本地启动器（默认端口；可在 Settings 中修改）

security:
  - bearerAuth: []

tags:
  - name: System
  - name: Fingerprints
  - name: Profiles
  - name: Folders
  - name: Proxies
  - name: Extensions
  - name: Bookmarks
  - name: Trash
  - name: Automation

paths:
  /health:
    get:
      tags: [ System ]
      summary: 检查服务器可用性
      description: 返回服务器基本信息。这是唯一**不**需要身份验证的端点。
      security: []
      responses:
        "200":
          description: 服务器正常运行。
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  name: { type: string, example: shardx-launcher }
                  version: { type: string, example: "0.1.0" }

  /fingerprint/new:
    get:
      tags: [ Fingerprints ]
      summary: 生成新指纹（主机 OS）
      description: |
        返回**主机**操作系统完全唯一化的指纹，不保存。
        等价于以主机平台调用 `/fingerprint/new/{platform}`。
      responses:
        "200":
          description: 唯一化的未保存指纹。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 指纹库为空。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprint/new/{platform}:
    get:
      tags: [ Fingerprints ]
      summary: 为指定平台生成新指纹
      description: "从库中随机选取与 `platform` 匹配的指纹，然后进行唯一化：\n生成新的 `platform_version`（用于 Sec-CH-UA），\n`hardware_concurrency`/`device_memory` 受主机限制（不超过真实值），\n屏幕裁剪至真实显示器尺寸。\n返回时不保存; 请作为 `fingerprint` 传入创建端点。\n"
      parameters:
        - name: platform
          in: path
          required: true
          description: 不区分大小写；接受别名 `win`/`osx`/`darwin`。
          schema:
            type: string
            enum: [ Windows, macOS, Linux ]
      responses:
        "200":
          description: 唯一化的未保存指纹。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 未找到匹配指纹或库为空。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles:
    get:
      tags: [ Profiles ]
      summary: 配置文件列表
      description: |
        返回永久配置文件（临时文件隐藏），按从新到旧排序，
        已置顶的排在最前。每条记录附带当前运行状态。
      responses:
        "200":
          description: 配置文件列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Profiles ]
      summary: 创建配置文件
      description: "将客户端传入的 `fingerprint` 对象**原样**保存为配置文件\n（不进行重新随机化; 唯一化已在 `/fingerprint/new` 完成）。\n使用 `folder` 将配置文件放入文件夹；通过存储中的 `proxy_id`\n或内联的 `proxy`（字符串，**不**保存到代理存储）绑定代理。\n"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: 已创建配置文件的元数据。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: 缺少 `fingerprint` 或其不是对象，或代理字符串无法解析。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/temporary:
    post:
      tags: [ Profiles ]
      summary: 创建临时配置文件
      description: |
        从库中随机（或指定）指纹创建配置文件，唯一化方式与
        `/fingerprint/new` 相同，原样保存，带 `temporary` 标志：
        在列表和界面中隐藏，浏览器关闭后**自动删除**（含数据文件夹，
        或在崩溃后下次启动时删除）。
        配合 `POST /profiles/{id}/start` 使用。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TempProfileRequest" }
      responses:
        "200":
          description: 已创建的临时配置文件。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  fingerprint_id:
                    type: string
                    description: 生成该配置文件所基于的库条目。
                  temporary: { type: boolean, example: true }
                  proxy_inline:
                    type: boolean
                    description: 是否附加了内联代理。
        "400":
          description: "无法解析的代理字符串，或未知的噪声向量。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 未找到匹配指纹 / 库为空。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}:
    get:
      tags: [ Profiles ]
      summary: 获取配置文件
      description: "返回完整的已保存配置文件：`_meta` 包装层加上\n展开的 FingerprintConfig。若配置文件正在运行; \n附带 `running` 和 `cdp`。\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: 已保存的配置文件。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 未找到配置文件。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Profiles ]
      summary: 删除配置文件
      description: "将配置文件移入回收站，可在 7 天内恢复，过期后自动清理。归档内容包括账户数据、cookies、登录信息、网页数据、偏好设置、Local Storage 和 IndexedDB，不包括缓存，因此归档仅占用户数据目录的一部分。创建归档后，原始配置和用户数据目录会被删除。\n\n临时配置文件在浏览器关闭时由进程跟踪器删除，不会进入回收站。"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: "配置文件已移至回收站。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
                  trashed:
                    type: boolean
                    example: true
                    description: "可在 7 天内从回收站恢复。"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: 删除时出错。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [ Profiles ]
      summary: 编辑配置文件
      description: "仅更新传入的字段。若传入 `fingerprint`; 它将**原样替换**\n已保存的指纹（不重新随机化）。\n`folder: \"\"` 将配置文件移出文件夹；`proxy_id: \"\"` 解绑代理；\n代理 `proxy` 字符串保存（去重）+ 完整测试，然后绑定。\n返回更新后的配置文件。\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditProfileRequest" }
      responses:
        "200":
          description: 更新后的已保存配置文件。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "400":
          description: 无效的 fingerprint（非对象）或无法解析的代理。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 未找到配置文件。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/start:
    post:
      tags: [ Profiles ]
      summary: 启动配置文件（含 CDP）
      description: "为配置文件启动启用了 remote-debugging 的 ShardX 浏览器，\n通过绑定代理填充 `auto` 字段（时区/语言/地理位置），\n并在 Chrome 写入 DevToolsActivePort 后返回 CDP 端点。\nCDP **仅**在通过 API 启动时启用（通过界面启动不开放调试端口; \n反检测能力不受影响）。\n若在超时内无法读取端点，`cdp` 返回 `null`。\n适用于普通配置文件和临时配置文件。\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: false
        description: 可选。空请求体以图形界面模式启动。
        content:
          application/json:
            schema:
              type: object
              properties:
                headless:
                  type: boolean
                  default: false
                  description: 以 headless 模式启动（--headless=new）。
      responses:
        "200":
          description: 已启动。
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  pid: { type: integer, format: int64, description: 操作系统进程 PID。 }
                  headless: { type: boolean }
                  cdp:
                    nullable: true
                    allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]
                  cdp_error:
                    type: string
                    nullable: true
                    description: "为什么 `cdp` 为空，当它是时。否则缺席。"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: 未配置二进制文件 / 无法启动进程。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/stop:
    post:
      tags: [ Profiles ]
      summary: 停止配置文件
      description: |
        向浏览器发送 graceful shutdown 信号（Unix 上为 SIGTERM；等待 5 秒，
        然后发送 SIGKILL）。临时配置文件在关闭过程中被删除。
        若配置文件未运行，`stopped` 返回 `false`。
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: 已发送停止命令。
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  stopped: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{id}/cookies:
    get:
      tags: [ Profiles ]
      summary: 导出 cookies
      description: |
        读取配置文件的 Chromium cookie 存储，以**解密形式**返回所有 cookies。
        对正在运行和已停止的配置文件均有效。
        若配置文件从未启动过，返回空数组。
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Cookies。
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    type: array
                    items: { $ref: "#/components/schemas/Cookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: 读取或解密 cookie 数据库时出错。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Profiles ]
      summary: 导入 cookies
      description: "将 cookies 写入配置文件存储（按 Chromium v10 方案重新加密）。\n配置文件**必须已停止**; 运行中的浏览器在退出时会覆盖存储，\n导致导入内容丢失。\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ cookies ]
              properties:
                cookies:
                  type: array
                  items: { $ref: "#/components/schemas/Cookie" }
      responses:
        "200":
          description: 已导入。
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer, description: 已写入的 cookie 数量。 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "配置文件正在运行; 请先停止它。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 写入 cookie 数据库时出错。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /folders:
    get:
      tags: [ Folders ]
      summary: 文件夹列表
      description: 所有永久配置文件中唯一的非空文件夹标签。
      responses:
        "200":
          description: 文件夹名称。
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [ "work", "scrapers" ]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}:
    patch:
      tags: [ Folders ]
      summary: 重命名文件夹
      description: 为文件夹中所有配置文件更新标签。返回受影响的配置文件数量。
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name ]
              properties:
                name: { type: string, description: 新文件夹名称。 }
      responses:
        "200":
          description: 已重命名。
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed_to: { type: string }
                  profiles: { type: integer, description: 已重新打标签的配置文件数量。 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [ Folders ]
      summary: 删除文件夹
      description: |
        删除文件夹标签。若 `delete_profiles=true`，文件夹内的配置文件也会被删除；
        否则它们移至"全部"（仅移除标签）。
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: delete_profiles
          in: query
          required: false
          description: 删除文件夹中的配置文件（默认 false = 仅移除标签）。
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 已删除。
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_folder: { type: string }
                  delete_profiles: { type: boolean }
                  profiles: { type: integer, description: 受影响的配置文件数量。 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}/profiles:
    post:
      tags: [ Folders ]
      summary: 在文件夹中创建配置文件
      description: |
        与 `POST /profiles` 相同，但文件夹从路径中获取
        （覆盖请求体中的 `folder` 字段）。
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: 已创建配置文件的元数据。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: 缺少 `fingerprint` 或其不是对象，或代理字符串无法解析。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fingerprints:
    get:
      tags: [ Fingerprints ]
      summary: 指纹库列表
      description: 磁盘上的指纹库（GPU 预设），由启动器提供/导入。
      responses:
        "200":
          description: 库条目。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /running:
    get:
      tags: [ Profiles ]
      summary: 正在运行的配置文件列表
      description: 拥有活跃浏览器进程的配置文件，通过 API 启动时包含 CDP 端点。
      responses:
        "200":
          description: 正在运行的配置文件。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunningProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies:
    get:
      tags: [ Proxies ]
      summary: 已保存代理列表
      description: 保存在启动器存储中的代理。**不返回凭据（用户名/密码）。**
      responses:
        "200":
          description: 代理摘要信息。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProxySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Proxies ]
      summary: 添加代理
      description: |
        将代理添加到存储（按端点去重）。传入
        `proxy` 字符串或显式的 `host`/`port` 字段（+ `kind`/`username`/`password`）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProxyRequest" }
      responses:
        "200":
          description: 已保存代理的摘要信息。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxySummary" }
        "400":
          description: 代理字符串无法解析 / 未提供 host 和 port。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies/{id}:
    delete:
      tags: [ Proxies ]
      summary: 删除代理
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已删除。
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions:
    get:
      tags: [ Extensions ]
      summary: "列出扩展"
      description: "返回配置文件可用的扩展。在 `POST /profiles` 或 `PATCH /profiles/{id}` 的 `extensions` 字段中使用扩展 `id`。由于数据 URL 可能很大，因此省略了图标。 `POST /extensions` 包含添加的扩展程序的图标。"
      responses:
        "200":
          description: "扩展列表。"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extension" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Extensions ]
      summary: "添加扩展程序"
      description: "请提供 `url` 或 `path` 之一。\n\n`url` 可以是 Chrome Web Store 页面、32 位扩展 ID，或指向 `.crx` 或 `.zip` 的直接链接。启动器会自行解析商店页面并下载文件。`path` 可以是启动器所在机器上的本地 `.crx`、`.zip` 或已解压目录。\n\n名称、版本、描述和图标均来自扩展自己的 `manifest.json`。其中的 `__MSG_*__` 占位符会根据默认语言环境解析。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExtensionRequest" }
      responses:
        "200":
          description: "添加了扩展。响应包括 `icon`。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extension" }
        "400":
          description: "既没有给出 `url` 也没有给出 `path`，链接不是扩展名，或者商店没有这样的 ID。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions/{id}:
    delete:
      tags: [ Extensions ]
      summary: "删除扩展"
      description: "配置文件保存 ID，而不是副本，因此任何命名此扩展的配置文件都会在下次启动时停止加载它。他们存储的列表保持原样；重新添加扩展不会恢复绑定。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "已删除。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks:
    get:
      tags: [ Bookmarks ]
      summary: "列出书签"
      responses:
        "200":
          description: "每个书签，跨文件夹。"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Bookmarks ]
      summary: "创建或更新书签"
      description: "提供 `id` 时更新对应书签，否则创建新书签。\n\n绑定到文件夹的书签会显示在该文件夹中每个配置文件的书签栏里，位置为 **ShardX** 文件夹。`folder: \"\"` 表示所有配置文件。系统只管理这个文件夹，不会修改操作者在配置文件中保存的其他书签。\n\n更改会在配置文件下次启动时应用。文件会在浏览器读取前写入，因此正在运行的配置文件不会立即看到更改。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkRequest" }
      responses:
        "200":
          description: "保存的书签。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400":
          description: "需要 `url`。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks/{id}:
    delete:
      tags: [ Bookmarks ]
      summary: "删除书签"
      description: "它会在下次发布时留下其个人资料。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "已删除。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash:
    get:
      tags: [ Trash ]
      summary: "列出已删除的个人资料"
      description: "返回由 `DELETE /profiles/{id}` 存档的配置文件（最新的在前）及其恢复到期时间。启动器启动时，过期的条目将被删除。"
      responses:
        "200":
          description: "回收站内容。"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash/{id}/restore:
    post:
      tags: [ Trash ]
      summary: "恢复已删除的个人资料"
      description: "使用配置文件的**原始 ID**恢复它，因此引用该配置文件的脚本、书签文件夹或代理绑定仍然有效。恢复后会删除归档。\n\n会恢复账户数据、cookies、登录信息、网页数据、偏好设置、历史记录、书签、Local Storage 和 IndexedDB。缓存不会被归档，会在下次启动时重新生成。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "恢复的个人资料。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "没有使用此 ID 的已删除配置文件。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trash/{id}:
    delete:
      tags: [ Trash ]
      summary: "永久删除已废弃的个人资料"
      description: "此操作不可逆，归档是唯一剩余副本。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "净化了。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects:
    get:
      tags: [ Automation ]
      summary: "列出自动化项目"
      description: "保存在启动器中的每个项目及其块和运行设置。这些与桌面 **Automation** 部分编辑的项目相同。"
      responses:
        "200":
          description: "项目清单。"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Automation ]
      summary: "创建项目"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "空时使用 `Untitled`。" }
      responses:
        "200":
          description: "创建项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}:
    get:
      tags: [ Automation ]
      summary: "获取项目"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "项目详情。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "未找到项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [ Automation ]
      summary: "替换项目"
      description: "完全替换项目。请发送 `GET` 返回的对象。路径中的 ID 优先于请求体中的 ID。项目不存在时返回 `404`；如需创建项目，请使用 `POST /automation/projects`。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationProject" }
      responses:
        "200":
          description: "已保存的项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "项目对象无效。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "未找到项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Automation ]
      summary: "删除项目"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "已删除。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "未找到项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/duplicate:
    post:
      tags: [ Automation ]
      summary: "重复项目"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "重复的项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "未找到项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/export:
    get:
      tags: [ Automation ]
      summary: "导出项目包"
      description: "标记为秘密的项目的参数在退出时被清空，因此可以在不带密码的情况下传递包。进口方再次索要。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "导出捆绑。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationBundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "未找到项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/import:
    post:
      tags: [ Automation ]
      summary: "导入项目包"
      description: "该捆绑包作为具有新 ID 的新项目到达。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationBundle" }
      responses:
        "200":
          description: "导入的项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "捆绑包无效或格式版本不受支持。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}/run:
    post:
      tags: [ Automation ]
      summary: "启动项目"
      description: "启动项目并立即返回。项目中的模块会启动所需的浏览器。使用 `/status` 查看进度。\n\n项目已在运行或没有启用的步骤时，返回 `400`。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "项目开始了。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  running: { type: boolean, example: true }
        "400":
          description: "项目已在运行或没有启用的步骤。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "未找到项目。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "此版本不支持自动化。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/stop:
    post:
      tags: [ Automation ]
      summary: "停止项目"
      description: "请求停止运行。每个浏览器会先完成当前步骤再关闭，因此接口返回后运行不会立即消失。请通过 `/status` 查看 `running` 字段。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "要求停止。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  stopping: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "此版本不支持自动化。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/status:
    get:
      tags: [ Automation ]
      summary: "获取项目运行状态"
      description: "如果项目未运行且自启动程序启动后未运行，则返回 `null`。 `log` 包含队列窗口中显示的最近条目。完整日志存储在 `automation-runs/` 下。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "运行状态或 `null`。"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutomationRun"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "此版本不支持自动化。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/runs:
    get:
      tags: [ Automation ]
      summary: "列出活动运行"
      responses:
        "200":
          description: "活动运行列表。"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "此版本不支持自动化。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules:
    get:
      tags: [ Automation ]
      summary: "列出已安装的模块"
      description: "返回操作者安装的 WebAssembly 模块。每个模块都会添加类型为 `module:<module id>:<block>` 的模块。模块返回由执行器执行的动作，不会直接访问页面。"
      responses:
        "200":
          description: "模块列表。"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "此版本不支持自动化。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Automation ]
      summary: "安装模块"
      description: "`path` 必须指向启动器所在机器上的本地 `.wasm` 文件。模块包含由操作者构建的原生代码。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ path ]
              properties:
                path: { type: string, example: "/home/me/module.wasm" }
      responses:
        "200":
          description: "安装的模块。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationModule" }
        "400":
          description: "缺少路径或不受支持的模块文件。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "此版本不支持自动化。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules/{id}:
    delete:
      tags: [ Automation ]
      summary: "移除模块"
      description: "使用该模块的项目停止工作。现有项目定义不会被修改。"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "已删除。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "未找到模块。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "此版本不支持自动化。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 来自 Settings → Automation API 的永久 JWT。

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: 配置文件的 UUID。
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: 缺失或无效的 Bearer 令牌。

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [ error ]

    FingerprintEnvelope:
      type: object
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
      required: [ fingerprint ]

    Fingerprint:
      type: object
      description: |
        原生 FingerprintConfig。记录的子对象为最常见的；
        该对象是开放的，创建端点会原样保存，
        因此此处的任何字段都会原封不动地传递。
      additionalProperties: true
      properties:
        name: { type: string }
        notes: { type: string }
        seed:
          type: integer
          description: 0 = 仅覆盖模式（典型情况）。
        navigator:
          type: object
          additionalProperties: true
          properties:
            user_agent: { type: string }
            platform: { type: string, example: "Win32" }
            hardware_concurrency: { type: integer, example: 12 }
            device_memory: { type: integer, enum: [ 8, 16, 32 ], example: 16 }
            language: { type: string }
            do_not_track: { type: boolean }
        screen:
          type: object
          additionalProperties: true
          properties:
            width: { type: integer }
            height: { type: integer }
            avail_width: { type: integer }
            avail_height: { type: integer }
            color_depth: { type: integer, example: 24 }
            device_pixel_ratio: { type: number, example: 2 }
            color_gamut: { type: string, enum: [ "", srgb, p3, rec2020 ] }
            refresh_rate:
              type: integer
              minimum: 24
              maximum: 480
              example: 60
              description: "所声明的显示刷新频率。缺席意味着 60。请参阅创建/编辑请求上的刷新率字段。"
        client_hints:
          type: object
          description: Sec-CH-UA 系列（在 browser.vision 中称为 `hints`）。
          additionalProperties: true
          properties:
            platform: { type: string }
            platform_version: { type: string }
            architecture: { type: string, example: "x86" }
            bitness: { type: string, example: "64" }
            mobile: { type: boolean }
        webgl:
          type: object
          additionalProperties: true
          properties:
            unmasked_vendor: { type: string }
            unmasked_renderer: { type: string }
        webgpu:
          type: object
          additionalProperties: true
        webrtc:
          type: string
          description: WebRTC 处理模式。
          enum: [ auto, tcp_only, block ]
        noise:
          $ref: "#/components/schemas/NoisePrefs"
        network:
          type: object
          properties:
            blocked_ports:
              type: array
              items: { type: integer }
              description: 局域网端口扫描防护（ports_protection）。
        timezone:
          type: string
          description: "IANA 名称或 \"auto\"; 将在启动时通过绑定代理解析。"

    NoisePrefs:
      type: object
      description: |
        各向量的反指纹噪音配置。每个块：`{enabled, seed}`
        （+ 特定参数）。`enabled:false` = 直接透传。
      properties:
        canvas: { $ref: "#/components/schemas/NoiseBlock" }
        webgl:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        audio:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        client_rects:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            max_offset: { type: number }
        sensors: { $ref: "#/components/schemas/NoiseBlock" }
        fonts:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          description: |
            `enabled:true` 为每个配置文件隐藏少量确定性的
            非关键字体子集（其余真实主机字体直接透传）。

    NoiseBlock:
      type: object
      properties:
        enabled: { type: boolean }
        seed:
          type: integer
          description: 每个配置文件的熵值；0 = 自动计算。

    CreateProfileRequest:
      type: object
      required: [ fingerprint ]
      properties:
        name: { type: string }
        notes: { type: string }
        proxy_id:
          type: string
          description: 绑定存储中的代理（按 id）。
        proxy:
          type: string
          description: "以字符串方式绑定代理（`host:port:user:pass` 或\n`scheme://user:pass@host:port`）。对于**永久**配置文件，代理\n会被添加到存储（按端点去重）并完成全量测试（UDP + 地理位置），\n然后按 id 绑定; 显示在代理列表中，QUIC/WebRTC 结果被缓存。\n对于**临时**配置文件，代理以内联方式附加（不保存）。\n若已指定 `proxy_id` 则忽略。\n"
          example: "socks5://user:pass@1.2.3.4:1080"
        folder:
          type: string
          description: "文件夹标签（对于 /folders/{folder}/profiles 被忽略; 路径优先）。"
        color:
          type: string
          description: "配置文件窗口图标和地址栏名称标签的强调色。省略时，图标颜色根据名称生成，标签保留浏览器工具栏的颜色。"
          example: "#2FCB80"
        extensions:
          type: array
          items: { type: string }
          description: "扩展库 ID (`GET /extensions`)，在启动时加载。库不保存的 id 是 400，而不是在没有它的情况下静默启动的配置文件。"
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "声称的显示刷新率，写入`screen.refresh_rate`。没有 Web API 报告它；页面通过计时 requestAnimationFrame 来衡量它，这就是为什么将其排除在外并不是中立的；缺席意味着 60，这是大多数机器报告的值，而不是主机自己的屏幕所做的任何内容。帧只能减慢，因此有效速率是主机面板在此或低于此的最接近的整个划分。"
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: 原样保存。从 /fingerprint/new 获取后按需编辑。

    EditProfileRequest:
      type: object
      description: "所有字段均为可选; 仅更新传入的字段。"
      properties:
        name: { type: string }
        notes: { type: string }
        folder: { type: string, description: '""将配置文件移出文件夹（移至"全部"）。' }
        proxy_id: { type: string, description: '""解绑代理。' }
        proxy:
          type: string
          description: "代理字符串; 保存（去重）+ 全量测试，然后绑定。"
        color:
          type: string
          description: "`#rrggbb`； “”回到源自名称的颜色。"
        extensions:
          type: array
          items: { type: string }
          description: "替换整个列表； `[]` 不加载任何内容。"
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "声明的显示刷新率，在 `fingerprint` 之后应用并写入 `screen.refresh_rate`。没有 Web API 报告它；页面通过计时 requestAnimationFrame 来衡量它，这就是为什么将其排除在外并不是中立的；缺席意味着 60，这是大多数机器报告的值，而不是主机自己的屏幕所做的任何内容。帧只能减慢，因此有效速率是主机面板在此或低于此的最接近的整个划分。"
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: 若提供，则原样**替换**已保存的指纹。

    TempProfileRequest:
      type: object
      properties:
        fingerprint_id:
          type: string
          description: 配置文件所基于的库条目；未提供时，在 `platform` 下随机选取。
        platform:
          type: string
          enum: [ Windows, macOS, Linux ]
          description: 若未指定 `fingerprint_id` 则用于随机选取指纹；两者均未提供时使用主机 OS。
        proxy:
          type: string
          description: 内联代理字符串（不保存到存储中）。
        name: { type: string }
        folder: { type: string }
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "声称的显示刷新率，写入`screen.refresh_rate`。没有 Web API 报告它；页面通过计时 requestAnimationFrame 来衡量它，这就是为什么将其排除在外并不是中立的；缺席意味着 60，这是大多数机器报告的值，而不是主机自己的屏幕所做的任何内容。帧只能减慢，因此有效速率是主机面板在此或低于此的最接近的整个划分。"
        noise:
          type: object
          description: "按向量设置指纹噪声。请求中省略的向量保留默认值（关闭）。\n\n同一个请求可以组合两种格式：\n\n  * 简写：`{\"canvas\": true, \"webgl\": true}`。这样启用 `webgl` 或 `client_rects` 时，也会使用界面中的默认强度；\n  * 完整对象：`{\"canvas\": {\"enabled\": true, \"seed\": 42}}`，格式与 `GET /profiles/{id}` 返回的对象相同。\n\n字段会与现有向量设置合并，而不是替换整个向量。例如 `{\"webgl\": {\"intensity\": 0.001}}` 不会修改 `enabled`。`seed` 为 0 或未提供时，系统会根据配置文件 ID 生成稳定值，避免两个临时配置文件使用相同的指纹。"
          additionalProperties:
            oneOf:
              - type: boolean
              - type: object
                properties:
                  enabled: { type: boolean }
                  seed: { type: integer, format: int64 }
                  intensity: { type: number, description: "仅限 `webgl`。" }
                  max_offset: { type: number, description: "仅限 `client_rects`。" }
          properties:
            canvas: {}
            webgl: {}
            audio: {}
            client_rects: {}
            sensors: {}
            fonts: {}
          example:
            canvas: true
            webgl: { enabled: true, intensity: 0.0005 }
            fonts: true

    Extension:
      type: object
      properties:
        id: { type: string, description: "将其传递到配置文件的 `extensions` 中。" }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        size_bytes: { type: integer, format: int64 }
        added_at: { type: string, description: "`@<unix_secs>`。" }
        icon:
          type: string
          nullable: true
          description: "清单声明的最大图标，作为 `data:` URL。列表端点和不提供任何内容的扩展上为 Null。"
    AddExtensionRequest:
      type: object
      description: "恰好是 `url` 或 `path` 之一。"
      properties:
        url:
          type: string
          description: "Chrome 网上应用店页面、裸露的 32 个字符的扩展 ID 或指向 `.crx` / `.zip` 的直接链接。"
          example: https://chromewebstore.google.com/detail/rabby-wallet/acmacodkjbdgmoleebolmdjonilkdbch
        path:
          type: string
          description: "启动器计算机上的本地 `.crx`、`.zip` 或解压文件夹。"

    Bookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        folder:
          type: string
          description: "启动器文件夹；空意味着每个配置文件。"

    BookmarkRequest:
      type: object
      required: [ url ]
      properties:
        id:
          type: string
          description: "显示该书签的更新；缺席创造一个。"
        url:
          type: string
          description: "裸主机就可以了；添加了 `https://`。"
          example: facebook.com/ads/manager
        title:
          type: string
          description: "空白使用地址本身。"
        folder:
          type: string
          description: "空（或不存在）意味着每个配置文件。"

    TrashEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        folder: { type: string }
        deleted_at: { type: integer, format: int64, description: "Unix 秒。" }
        expires_at:
          type: integer
          format: int64
          description: "Unix 秒；启动扫描会删除所有过去的内容。"
        size_bytes:
          type: integer
          format: int64
          description: "存档，保存帐户而不是缓存。"

    ProfileMeta:
      type: object
      description: 启动器中配置文件的元数据（创建时返回）。
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        proxy_id: { type: string, nullable: true }
        last_launched_at: { type: string, nullable: true, description: ISO-8601 或 null。 }
        created_at: { type: string, nullable: true }
        pinned: { type: boolean }
        folder: { type: string }
        color:
          type: string
          nullable: true
          description: "图标强调色，格式为 `#rrggbb`；`null` 表示根据名称自动生成颜色，这是浏览器在未选择颜色时的默认行为。"
        extensions:
          type: array
          items: { type: string }
          description: "启动时加载的扩展库 ID。"

    ProfileListItem:
      allOf:
        - $ref: "#/components/schemas/ProfileMeta"
        - type: object
          properties:
            running: { type: boolean }
            pid: { type: integer, format: int64, nullable: true }
            cdp:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    StoredProfile:
      type: object
      description: |
        磁盘上的完整配置文件：`_meta` 包装层加上展开的
        FingerprintConfig（所有 `Fingerprint` 字段位于顶层）。
        `running`/`cdp` 仅在配置文件运行时存在。
      additionalProperties: true
      properties:
        _meta:
          type: object
          properties:
            id: { type: string, format: uuid }
            proxy_id: { type: string, nullable: true }
            inline_proxy:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/ProxyEntry" } ]
            last_launched_at: { type: string, nullable: true }
            created_at: { type: string, nullable: true }
            pinned: { type: boolean }
            folder: { type: string }
            temporary: { type: boolean }
            rev:
              type: integer
              description: "每次写入都会递增。桌面编辑器会回传打开配置文件时的版本号；如果配置文件已通过此 API 修改，桌面保存会被拒绝，以免覆盖修改。API 修改不会被拒绝，而是读取并一次性写回配置文件。"
        running: { type: boolean }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    CdpInfo:
      type: object
      description: 正在运行的配置文件的 CDP 端点。
      properties:
        port: { type: integer, description: Chrome 选择的 remote-debugging 端口。 }
        http_url:
          type: string
          example: "http://127.0.0.1:53217"
          description: REST 基础地址（/json、/json/version）。
        web_socket_debugger_url:
          type: string
          example: "ws://127.0.0.1:53217/devtools/browser/ab12-..."
          description: Puppeteer/Playwright `connect` 使用的浏览器级 WS 端点。

    RunningProfile:
      type: object
      properties:
        profile_id: { type: string }
        pid: { type: integer, format: int64 }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    LibraryEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        platform: { type: string, enum: [ Windows, macOS, Linux ] }
        chrome: { type: string, description: Chrome 版本字符串。 }
        gpu: { type: string }
        builtin: { type: boolean, description: 包含在随附的起始集中。 }

    AddProxyRequest:
      type: object
      description: 代理字符串或显式字段（字符串优先）。
      properties:
        proxy:
          type: string
          description: "`scheme://user:pass@host:port` 或 `host:port:user:pass`。"
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        name: { type: string }
        country: { type: string }
        notes: { type: string }

    ProxySummary:
      type: object
      description: 不含凭据的已保存代理信息。
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        country: { type: string, description: 信息标签（例如"US"）。 }

    Cookie:
      type: object
      description: "工具友好格式的 cookie（兼容 EditThisCookie / Puppeteer 格式; \n导入时接受 `httpOnly`/`sameSite` 作为别名）。\n"
      required: [ domain, name, value ]
      properties:
        domain:
          type: string
          description: Cookie 主机（Chromium `host_key`），例如".example.com"。
        name: { type: string }
        value: { type: string }
        path: { type: string, default: "/" }
        expires:
          type: number
          nullable: true
          description: Unix 秒数；null/缺失 = 会话 cookie。
        secure: { type: boolean, default: false }
        http_only: { type: boolean, default: false }
        same_site:
          type: string
          enum: [ Strict, Lax, None, unspecified ]
          description: 导入时不区分大小写。

    ProxyEntry:
      type: object
      description: 完整的代理条目（嵌入在 `_meta.inline_proxy` 中）。
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        country: { type: string }
        notes: { type: string }

    AutomationBranch:
      description: "步骤执行后的分支目标。简单情况使用字符串，需要传值时使用对象。"
      oneOf:
        - type: string
          enum: [ next, stop, endpass ]
          description: "`next`；下面的步骤。 `stop`；结束此配置文件的整个运行。 `endpass`；结束本次传递；下一个从顶部开始。"
        - type: object
          properties:
            goto: { type: string, description: "要跳转到的块 id；不再存在的行为与下一个一样。" }
        - type: object
          properties:
            retry: { type: integer, description: "再次尝试同样的步骤，多次，然后进行下一步。" }

    AutomationBlock:
      type: object
      description: "一步。 `kind` 和 `params` 已开放；模块可以添加此构建从未听说过的类型。"
      properties:
        id: { type: string }
        kind:
          type: string
          description: "内置调色板类型（`goto`、`click`、`type`、`profile.create`、`var.set` 等）或 `module:<module id>:<block>`。\n\n**在移动配置文件中**，普通步骤会转换为触摸操作：`click` 执行点按，`rightClick` 执行长按，`scroll` 和 `swipe` 使用触摸手势。移动设备没有指针，因此不支持 `hover`。以下步骤仅适用于移动配置文件，在桌面配置文件中会被拒绝：\n\n| 类型 | 参数 | 操作 | | --- | --- | --- | | `touch.tap` | `selector` 或 `x`+`y`、`tapCount`（1-3）、`timeout` | 点按目标。 | | `touch.longPress` | `selector` 或 `x`+`y`、`timeout` | 按住不放。 | | `touch.swipe` | `selector` 或 `x`+`y`、`dx`、`dy`、`timeout` | 滑动。 | | `touch.drag` | `selector`、`to`、`holdMs`、`timeout` | 拖动元素。 | | `touch.pinch` | `scale`、`selector` 或 `x`+`y` | 双指缩放。值大于 1 时缩小。 | | `screen.rotate` | `angle`（0/90/180/270）、`turnMs`、`into` | 旋转设备。`into` 保存新的 `screen.orientation.type`。 |"
          example: click
        label: { type: string }
        params:
          type: object
          additionalProperties: true
          description: "步骤自己的字段，如调色板定义的那样。"
        enabled: { type: boolean, default: true }
        x: { type: number, description: "画布位置。仅用于布局，执行顺序由分支决定。" }
        y: { type: number }
        on_done: { $ref: "#/components/schemas/AutomationBranch" }
        on_fail:
          allOf:
            - $ref: "#/components/schemas/AutomationBranch"
          description: "默认为 `stop`；单击后什么也没找到，这就是运行输入错误页面的原因。"
        secrets:
          type: array
          items: { type: string }
          description: "导出时参数名称被清空。"

    AutomationRunSettings:
      type: object
      properties:
        threads: { type: integer, default: 1, description: "浏览器同时运行；限制为 1-64。" }
        loops: { type: integer, default: 1, description: "越过街区。 0 表示运行直到 `hours` 启动。" }
        hours: { type: number, description: "仅当 `loops` 为 0 时才有意义。" }
        start: { type: string, description: "块 ID 开始；空的意思是第一个。" }
        profiles:
          type: array
          items: { type: string }
          description: "保留在配置文件成为块之前保存的项目；设置时各一根线。"

    AutomationProject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/AutomationBlock" }
        run: { $ref: "#/components/schemas/AutomationRunSettings" }
        created_at: { type: integer, description: "Unix 秒。" }
        updated_at: { type: integer, description: "Unix 秒。" }

    AutomationBundle:
      type: object
      description: "一个项目正在转移到另一台机器上。"
      properties:
        format: { type: integer, example: 1, description: "导入拒绝它不知道的号码。" }
        exported_at: { type: integer, description: "Unix 秒。" }
        project: { $ref: "#/components/schemas/AutomationProject" }
        modules:
          type: array
          items: { type: string }
          description: "模块 ID 需要的步骤。"
        module_files:
          type: array
          description: "这些模块的文件位于捆绑包内，以便导入的项目可以在其所在的位置运行。导出时磁盘中丢失的模块在此处被忽略，但仍以 `modules` 命名。导入时，已安装在同一 ID 下的模块将保持原样，而不是被覆盖。"
          items:
            type: object
            properties:
              id: { type: string }
              wasm: { type: string, description: ".wasm 经过 gzip 压缩，然后进行 Base64 处理。" }
        needs:
          type: array
          description: "导出的内容被清空，因此导入可以准确地要求该内容。"
          items:
            type: object
            properties:
              block_id: { type: string }
              label: { type: string }
              params:
                type: array
                items: { type: string }

    AutomationWorker:
      type: object
      description: "运行一个浏览器。"
      properties:
        profile_id: { type: string }
        profile_name: { type: string }
        pass: { type: integer, description: "1 为基础； 0 在第一遍开始之前。" }
        step: { type: integer }
        steps_total: { type: integer }
        status: { type: string, enum: [ queued, starting, running, done, failed, stopped ] }
        note: { type: string }

    AutomationRun:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        started_at: { type: integer, description: "Unix 秒。" }
        running: { type: boolean }
        workers:
          type: array
          items: { $ref: "#/components/schemas/AutomationWorker" }
        log:
          type: array
          items: { type: string }
          description: "机队窗口显示的尾部；整个日志位于磁盘上的 `automation-runs/` 下。"

    AutomationModule:
      type: object
      properties:
        id: { type: string, description: "文件茎；还有其每个块类型所携带的前缀。" }
        name: { type: string }
        path: { type: string }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
          description: "块描述符，形状与内置调色板相同。"
        error: { type: string, description: "模块加载成功时为空，否则为错误原因。" }
