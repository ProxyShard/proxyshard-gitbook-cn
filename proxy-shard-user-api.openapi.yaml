servers:
  - url: https://user-api.proxyshard.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
      required:
        - success
        - message
    PurchaseRequest:
      type: object
      properties:
        product:
          type: string
          example: Datacenter Proxy
        location:
          type: string
          nullable: true
          example: DE
        cycle:
          type: string
          example: monthly
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 10
        promo_code:
          type: string
          nullable: true
          example: SAVE10
        auto_renewal:
          type: boolean
          default: false
      required:
        - product
        - cycle
    PurchaseRequestDcIsp:
      type: object
      description: 为数据中心/ISP 购买 — 需要位置字段。
      properties:
        product:
          type: string
          enum:
            - Datacenter Proxy
            - ISP Proxy
          example: Datacenter Proxy
        location:
          type: string
          example: DE
        cycle:
          type: string
          example: monthly
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 10
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
      required:
        - product
        - location
        - cycle
      x-gitbook-description-html: <p>购买数据中心/ISP — 位置字段是必需的。</p>
    PurchaseRequestResidentialStandard:
      type: object
      description: >-
        购买标准住宅代理 — 不需要位置；循环
        是固定的（一生）。
      properties:
        product:
          type: string
          enum:
            - Standart Residential Proxy
          example: Standart Residential Proxy
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        promo_code:
          type: string
          nullable: true
      required:
        - product
      x-gitbook-description-html: >-
        <p>购买标准住宅代理 — 不需要位置；循环
        是固定的（生命周期）。</p>
    PurchaseRequestResidentialPremium:
      type: object
      description: >-
        购买高级住宅代理 — 不需要位置；循环
        是固定的（一生）。
      properties:
        product:
          type: string
          enum:
            - Premium Residential Proxy
          example: Premium Residential Proxy
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        promo_code:
          type: string
          nullable: true
      required:
        - product
      x-gitbook-description-html: >-
        <p>购买高级住宅代理 — 不需要位置；循环
        是固定的（生命周期）。</p>
    PurchaseRequestResidentialUnmetered:
      type: object
      description: 购买不限流量住宅代理 — 支持自动续订。
      properties:
        product:
          type: string
          enum:
            - Unmetered Residential proxy
          example: Unmetered Residential proxy
        cycle:
          type: string
          example: monthly
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
      required:
        - product
        - cycle
      x-gitbook-description-html: >-
        <p>购买不限流量住宅代理 — 支持
        自动续订.</p>
    PurchaseResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Order paid successfully
        order_id:
          type: integer
      required:
        - success
        - message
        - order_id
    ActiveProxyItem:
      type: object
      properties:
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        http_port:
          type: integer
        socks_port:
          type: integer
        until:
          type: string
          description: ISO8601/字符串日期
          x-gitbook-description-html: <p>ISO8601/字符串日期</p>
        status:
          type: string
      required:
        - ip
        - username
        - password
        - http_port
        - socks_port
        - until
        - status
    AvailableCountRequest:
      type: object
      properties:
        country:
          type: string
          example: DE
        product:
          type: string
          example: dc
      required:
        - country
        - product
    AvailableCountResponse:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
        amount:
          type: integer
      required:
        - country
        - product
        - amount
    ApiMeResponse:
      type: object
      properties:
        email:
          type: string
        active_orders:
          type: integer
        wallet_balance:
          type: integer
          description: 以美分为单位
          x-gitbook-description-html: <p></p>
      required:
        - email
        - active_orders
        - wallet_balance
    ProductWithCycles:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        cycles:
          type: array
          items:
            type: string
      required:
        - name
        - cycles
    AddBandwidthRequest:
      type: object
      properties:
        amount:
          type: integer
          example: 5
          description: 容量（GB）
          x-gitbook-description-html: <p>GB 量 </p>
        promo_code:
          type: string
          nullable: true
      required:
        - amount
    GetSubUsersRequest:
      type: object
      properties:
        offset:
          type: integer
          example: 0
          description: 偏移量（默认 0）
          x-gitbook-description-html: <p>偏移（默认0）</p>
        limit:
          type: integer
          example: 20
          description: 页面大小（默认 20）
          x-gitbook-description-html: <p>页面大小（默认20）</p>
    EditSubUserPayload:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateSubUserPayload:
      type: object
      properties:
        proxy_type:
          type: string
          example: standart
        name:
          type: string
        data:
          type: integer
          example: 5
          description: 容量（GB）
          x-gitbook-description-html: <p>GB 量 </p>
      required:
        - proxy_type
        - name
        - data
    ChangeSubUserPasswordPayload:
      type: object
      properties:
        proxy_type:
          type: string
          example: standart
      required:
        - proxy_type
    ModifyTrafficPayload:
      type: object
      properties:
        proxy_type:
          type: string
          example: standart
        data:
          type: integer
          example: 5
          description: 容量（GB）
          x-gitbook-description-html: <p>GB 量 </p>
      required:
        - proxy_type
        - data
    Country:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: ISO国家代码
          x-gitbook-description-html: <p>ISO国家代码</p>
        name:
          type: string
          maxLength: 255
          description: 国家名称
          x-gitbook-description-html: <p>国名</p>
      required:
        - code
        - name
    Region:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: 地区代码（州/省代码）
          x-gitbook-description-html: <p>地区代码（州/省代码）</p>
        name:
          type: string
          maxLength: 255
          description: 地区名称（州/省名称）
          x-gitbook-description-html: <p>地区名称（州/省名称）</p>
        country:
          $ref: '#/components/schemas/Country'
      required:
        - code
        - name
        - country
    City:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: 城市代码（通常为 slug 格式）
          x-gitbook-description-html: <p>城市代码（通常为slug格式）</p>
        name:
          type: string
          maxLength: 255
          description: 城市名称
          x-gitbook-description-html: <p>城市名称</p>
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              maxLength: 10
              description: 地区代码
              x-gitbook-description-html: <p>区域代码</p>
            name:
              type: string
              maxLength: 255
              description: 地区名称
              x-gitbook-description-html: <p>区域名称</p>
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedCountriesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
        - count
        - results
    PagedRegionsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Region'
      required:
        - count
        - results
    PagedCitiesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
        - count
        - results
paths:
  /user/api/orders/purchase:
    post:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: 创建订单并付款
      description: |
        按产品名称、地点和周期购买。
        对于数据中心/ISP，需要位置。
        对于标准住宅代理，不需要位置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PurchaseRequestDcIsp'
                - $ref: '#/components/schemas/PurchaseRequestResidentialStandard'
                - $ref: '#/components/schemas/PurchaseRequestResidentialPremium'
                - $ref: '#/components/schemas/PurchaseRequestResidentialUnmetered'
                - $ref: '#/components/schemas/PurchaseRequest'
            examples:
              datacenter:
                value:
                  product: Datacenter Proxy
                  location: DE
                  cycle: monthly
                  quantity: 10
                  auto_renewal: true
              isp:
                value:
                  product: ISP Proxy
                  location: US
                  cycle: monthly
                  quantity: 5
              residentialStandard:
                value:
                  product: Standart Residential Proxy
                  quantity: 1
              residentialPremium:
                value:
                  product: Premium Residential Proxy
                  quantity: 1
              residentialNew:
                value:
                  product: Residential Proxy NEW
                  cycle: monthly
                  quantity: 1
              unmeteredResidential:
                value:
                  product: Unmetered Residential proxy
                  cycle: monthly
                  auto_renewal: true
              mobile:
                value:
                  product: Mobile Proxy Plan Name
                  cycle: day
                  quantity: 1
      responses:
        '200':
          description: 成功的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
          x-gitbook-description-html: <p>成功</p>
        '400':
          description: 验证/余额错误/库存不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>验证/余额错误/库存不足</p>
        '401':
          description: 未经授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>未经授权</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      按产品名称、地点和周期购买。为了
                      数据中心/ISP，需要位置。标准版
                      住宅代理，位置不需要。
                    marks: []
                key: a6YDYJfLO9R9
            key: S5jpGa8ot9FH
        key: 7j57RKNQ66xt
      x-gitbook-description-html: >-
        <p>按产品名称、地点、周期进行采购。对于数据中心/ISP，
        位置为必填项。对于标准住宅代理，位置不是
        必填.</p>
  /user/api/orders/change-billing-cycle/{order_id}:
    post:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: 更改订单结算周期
      description: >
        按周期名称更改计费周期。仅适用于数据中心和 ISP
        代理。

        如果促销代码在所选周期内不可用，则会自动
        重置。
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cycle:
                  type: string
                  example: monthly
              required:
                - cycle
      responses:
        '200':
          description: 成功的
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    type: object
          x-gitbook-description-html: <p>成功</p>
        '400':
          description: 无效的产品或周期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>无效的产品或周期</p>
        '401':
          description: 未经授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>未经授权</p>
        '403':
          description: 该用户无法使用循环
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>该用户无法使用循环</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      按周期名称更改计费周期。只为
                      数据中心和 ISP 代理。如果促销代码不适用于
                      选定的周期后，将自动重置。
                    marks: []
                key: FCRCqYnCRIMJ
            key: CstYjsmMFFpH
        key: RctxTbOKuya7
      x-gitbook-description-html: >-
        <p> 按周期名称更改计费周期。仅适用于数据中心和
        ISP 代理。如果促销代码不适用于所选周期，则将
        自动复位.</p>
  /user/api/orders/edit-auto-renewal/{order_id}:
    post:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: 变更订单自动续订
      description: |
        启用/禁用自动续订。仅适用于数据中心和 ISP 代理。
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
        - in: query
          name: auto_renewal
          required: true
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: 成功的
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
          x-gitbook-description-html: <p>成功</p>
        '400':
          description: 此操作的产品无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>此操作无效产品</p>
        '401':
          description: 未经授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>未经授权</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      启用/禁用自动续订。仅适用于数据中心和
                      ISP 代理。
                    marks: []
                key: K9SC5NGtClVi
            key: wsP9craixrO9
        key: lPUU4UXDZMgV
      x-gitbook-description-html: >-
        <p>启用/禁用自动续订。仅适用于数据中心和 ISP
        代理.</p>
  /user/api/proxies/active:
    get:
      tags:
        - Datacenter & ISP Proxies
      security:
        - bearerAuth: []
      summary: 获取订单的有效代理
      parameters:
        - in: query
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 代理列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveProxyItem'
                  order_tag:
                    type: string
                    nullable: true
                required:
                  - success
                  - data
          x-gitbook-description-html: <p>代理列表</p>
        '403':
          description: 此订单无法使用该方法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p> 该订单无法使用该方法</p>
  /user/api/proxies/products:
    get:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: 获取产品及其周期
      description: 返回具有可用循环名称的 API 产品。
      responses:
        '200':
          description: 产品列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductWithCycles'
                required:
                  - success
                  - products
          x-gitbook-description-html: <p>产品列表</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: 返回具有可用循环名称的 API 产品。
                    marks: []
                key: ae0gjXUIoxK0
            key: H8DZM6car1fH
        key: dPLJyH3Xi2mm
      x-gitbook-description-html: <p> 返回具有可用循环名称的 API 产品。</p>
  /user/api/proxies/available-count:
    get:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: 查看可用代理数量
      description: 返回所有产品的总可用数量。
      responses:
        '200':
          description: 成功的
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableCountResponse'
          x-gitbook-description-html: <p>成功</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      返回所有可用的总数量
                      产品。
                    marks: []
                key: rZiZPAWJWDci
            key: 89ELMwrVTwTZ
        key: hs4oQPezyl5t
      x-gitbook-description-html: <p> 返回所有产品的总可用数量。</p>
  /user/api/me:
    get:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: 用户信息
      responses:
        '200':
          description: 个人资料数据
          content:
            application/json:
              schema:
