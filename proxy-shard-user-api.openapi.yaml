  /user/api/proxies/isps:
    get:
      tags:
        - Residential Proxies
      summary: "列出 ISP"
      description: "城市内可用的互联网提供商；继国家、地区、城市之后的第四个目标级别。与其他位置端点不同，这个端点需要完整的链：`country_code`、`region_code` 和 `city_code` 都是必需的，因为上游 ISP 与城市绑定。仅高级套餐：不为标准套餐和无限制套餐维护 ISP 目录，任何其他 `proxy_type` 都会被拒绝并返回 400。仅列出主要城市的 ISP，因此对于较小的城市，带有 `count: 0` 的空 `results` 是正常答案。"
      parameters:
        - in: query
          name: proxy_type
          required: true
          description: "必须为 `premium`；ISP 定向仅适用于 premium 套餐。"
          schema:
            type: string
            enum:
              - premium
        - in: query
          name: country_code
          required: true
          description: "ISO国家代码"
          schema:
            type: string
        - in: query
          name: region_code
          required: true
          description: "地区或州代码"
          schema:
            type: string
        - in: query
          name: city_code
          required: true
          description: "来自 GET /user/api/proxies/cities 的城市代码"
          schema:
            type: string
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIspsResponse'
        '400':
          description: "proxy_type 不是 `premium`，未设置用户常驻，或者用户没有对该包的有效订单"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                notPremium:
                  value:
                    success: false
                    message: ISP targeting is available for the premium package only
        '401':
          description: "未经授权"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
