  /user/api/proxies/isps:
    get:
      tags:
        - Residential Proxies
      summary: List ISPs
      description: |
        Internet providers available inside a city — the fourth targeting level after country, region and city.
        Unlike the other location endpoints this one needs the full chain: `country_code`, `region_code` AND `city_code` are all required, because upstream ISPs are bound to a city.
        Premium package only: the ISP catalogue is not maintained for the standart and unlimited packages, and any other `proxy_type` is rejected with 400.
        ISPs are listed for major cities only, so an empty `results` with `count: 0` is a normal answer for a smaller city.
      parameters:
        - in: query
          name: proxy_type
          required: true
          description: Must be `premium` — ISP targeting is premium-only
          schema:
            type: string
            enum:
              - premium
        - in: query
          name: country_code
          required: true
          description: ISO country code
          schema:
            type: string
        - in: query
          name: region_code
          required: true
          description: Region code (state/province code)
          schema:
            type: string
        - in: query
          name: city_code
          required: true
          description: City code from GET /user/api/proxies/cities
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIspsResponse'
        '400':
          description: proxy_type is not `premium`, user resident is not set, or the user has no active order for the package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                notPremium:
                  value:
                    success: false
                    message: ISP targeting is available for the premium package only
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
