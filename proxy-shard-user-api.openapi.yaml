                    type: integer
                    description: "分配的数据总量（以字节为单位）"
                  data_remain:
                    type: integer
                    description: "剩余数据（以字节为单位）"
                  data_spent:
                    type: integer
                    description: "消耗的数据（以字节为单位）"
                  proxy_password:
                    type: string
                    description: "父帐户的代理密码"
                required:
                  - success
                  - data
                  - data_remain
                  - data_spent
