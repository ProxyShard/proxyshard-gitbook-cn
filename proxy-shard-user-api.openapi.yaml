  /user/api/proxies/analytics/{kind}:
    get:
      tags:
        - Residential Proxies
      summary: 账户统计
      description: |
        账户本身的流量统计。

        `kind`：
        * `overall`：按时间区间统计该时段内的流量和请求数；
        * `domains`：按目标主机统计该时段内的流量和请求数；
        * `connections`：当前打开的连接（无时间段）。

        默认只统计账户自身的流量。传入 `include_sub_users=true` 可加上该账户的所有子用户。
      parameters:
        - in: path
          name: kind
          required: true
          description: overall | domains | connections
          schema:
            type: string
            enum:
              - overall
              - domains
              - connections
        - in: query
          name: proxy_type
          required: true
          description: 代理类型（standart | premium | unlimited）
          schema:
            type: string
        - in: query
          name: start
          required: false
          description: 时间窗开始（含），格式为 ISO 8601、`YYYY-MM-DD HH:MM:SS` 或 Unix 时间戳。`connections` 忽略此参数。
          schema:
            type: string
        - in: query
          name: end
          required: false
          description: 时间窗结束（不含），默认为当前时间。`connections` 忽略此参数。
          schema:
            type: string
        - in: query
          name: timezone
          required: false
          description: 区间边界使用的 IANA 时区，默认 UTC
          schema:
            type: string
        - in: query
          name: include_sub_users
          required: false
          description: 统计账户及其所有子用户（默认 false）
          schema:
            type: boolean
        - in: query
          name: limit
          required: false
          description: 每页数量
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: 跳过的结果数
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
