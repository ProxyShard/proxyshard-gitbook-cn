# ============================================================================
# ShardX User API: OpenAPI 3.0.3.
#
# ИСТОЧНИК ПРАВДЫ по публичному API. Раньше спека жила только в GitBook
# (docs.shardx.com/proxyshard-api/*), из-за чего расходилась с кодом
# незаметно: ответы ручек уже отдавали message и proxy_password, а спека
# продолжала обещать старую форму.
#
# Правила:
#   * добавил/изменил ручку в services/user-api - правь этот файл в ТОМ ЖЕ
#     коммите;
#   * теги = страницы в GitBook, менять их имена без нужды не стоит;
#   * после мержа залить файл в GitBook (OpenAPI-спека проекта), иначе
#     клиенты снова увидят устаревшее.
#
# Проверка перед заливкой:
#   python -m openapi_spec_validator services/user-api/openapi.yaml
# ============================================================================
openapi: 3.0.3
info:
  title: ShardX 用户 API 计费
  version: 1.3.1
servers:
  - url: https://user-api.shardx.com
security:
  - bearerAuth: []
tags:
  - name: General
    description: 一般操作（简介、订单、参考数据）
  - name: Datacenter & ISP Proxies
    description: 数据中心和 ISP 代理的操作
  - name: Residential Proxies
    description: 住宅代理的操作
  - name: Service
    description: "健康探测（无身份验证）"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: |
        可选。逻辑操作的唯一标识符（1–128 个 `[A-Za-z0-9_.:-]` 字符），例如 UUID。
        重试结果未知的请求（超时、连接中断）时，请发送相同的键：已完成的请求不会再次执行，而是返回其原始响应。

        本 API 的所有修改类端点（`POST`/`PUT`/`PATCH`/`DELETE`）都接受此标头：购买、续订、追加流量、组件以及今后新增的端点；涉及扣款的端点会明确列出。

        * 除子用户操作外的所有端点：保存的响应会在 7 天内带 `Idempotency-Replayed: true` 标头重放。`409`：使用此键的请求仍在执行（`idempotency_state: in_progress`），或未完成且需要人工核实结果（`idempotency_state: unknown`；不会再次执行）。`422`：该键已用于另一个请求。限流返回的 `429` 不会消耗该键，请使用同一个键重试。
        * 子用户端点（创建、`data/add`、`data/subtract`）：该键会转发给代理提供商，24 小时内重试不会两次修改配额。`409`：操作仍在进行，或该键已用于不同的数据。

        不带此标头时，请求照常执行，但没有上述保障。
      schema:
        type: string
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
  responses:
    BadRequest:
      description: |
        请求无效；原因见 `message`。大多数校验返回 JSON（`ApiError`），少数返回纯文本（`Content-Type: text/plain`）：`Invalid proxy type`、`User don't have active order with this proxy type`、`User resident not set for user`（住宅代理端点），`Addon not available for this product`、`Invalid addons_json` 以及组件数量校验（组件端点、带组件的购买和计算），还有代理服务器在 `signature/set` 和 `del-np/set` 中返回的错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
        text/plain:
          schema:
            type: string
            example: Invalid proxy type
    Unauthorized:
      description: 缺少 API 密钥或密钥无效：`Missing or invalid Authorization header`、`Invalid API key`、`API key mismatch`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: |
        内部错误。当订单（或所需的其他记录）不存在或不属于您的账户时，API 同样返回 `500`；具体原因见 `message`，例如 `Order not found`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UpstreamError:
      description: '代理提供商不可用或返回错误（`Upstream error: <status>`）'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: |
        同一账户 3 秒内超过 1 次请求。响应体为纯文本（`Too many requests, retry in <N>s`），`x-ratelimit-after` 标头给出需要等待的秒数。Idempotency-Key 不会被消耗：请使用同一个键重试。
      content:
        text/plain:
          schema:
            type: string
            example: Too many requests, retry in 2s
    IdempotencyConflict:
      description: |
        使用此 Idempotency-Key 的请求仍在执行（`idempotency_state: in_progress`），或未完成且需要人工核实结果（`idempotency_state: unknown`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    IdempotencyMismatch:
      description: 该 Idempotency-Key 已用于另一个请求
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ActiveProxyItem:
      type: object
      properties:
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        http_port:
          type: integer
        socks_port:
          type: integer
        until:
          type: string
          description: ISO8601/字符串日期
        status:
          type: string
        signature:
          type: string
          nullable: true
          description: "p0f 分配给IP的签名，不设置时为空"
      required:
        - ip
        - username
        - password
        - http_port
        - socks_port
        - until
        - status
    ApiError:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        rejected:
          type: boolean
          description: 子用户操作：提供商拒绝了该操作且未发生任何更改时为 `true`
        idempotency_state:
          type: string
          enum:
            - in_progress
            - unknown
          description: 仅出现在 Idempotency-Key 校验返回的 `409` 中
        order_id:
          type: integer
          description: 仅出现在购买和 add-bandwidth 返回的 `502` 中：已付款的订单
        refunded:
          type: boolean
          description: 仅出现在购买和 add-bandwidth 返回的 `502` 中：`true` 表示款项已退回钱包，`false` 表示退款尚未完成，请联系支持
      required:
        - success
        - message
    AddonLine:
      type: object
      description: "订单上存储的一条附加行"
      properties:
        addon_key:
          type: string
        catalog_id:
          type: integer
        qty:
          type: integer
          description: "当期活跃单位"
        price_per_unit:
          type: integer
          description: "购买时的单价（以美分为单位）"
        pending:
          description: "更改计划下次续订，或 `null`"
          nullable: true
          type: object
          properties:
            action:
              type: string
              enum:
                - cancel
                - downgrade
            next_qty:
              type: integer
              description: "降级后目标数量"
    PurchaseRequestDcIsp:
      type: object
      description: "为数据中心/ISP 购买; 需要位置字段。"
      properties:
        product:
          type: string
          enum:
            - Datacenter Proxy
            - ISP Proxy
        location:
          type: string
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "购买时附加的组件，例如 DC 或 ISP 的 `p0f_slots`"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - location
        - cycle
    PurchaseRequestResidentialStandard:
      type: object
      description: "购买标准住宅代理；无需位置；计费周期固定为 lifetime。"
      properties:
        product:
          type: string
          enum:
            - Standart Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "购买时附加的附加组件，例如 DC 或 ISP 的 `p0f_slots`"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialPremium:
      type: object
      description: "购买高级住宅代理；无需位置；计费周期固定为 lifetime。"
      properties:
        product:
          type: string
          enum:
            - Premium Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "购买时附加的附加组件，例如 DC 或 ISP 的 `p0f_slots`"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialUnmetered:
      type: object
      description: "购买不限流量住宅代理; 支持自动续订。"
      properties:
        product:
          type: string
          enum:
            - Unmetered Residential proxy
        cycle:
          type: string
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "购买时附加的附加组件，例如 DC 或 ISP 的 `p0f_slots`"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseRequest:
      type: object
      properties:
        product:
          type: string
        location:
          type: string
          nullable: true
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "购买时附加的附加组件，例如 DC 或 ISP 的 `p0f_slots`"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        order_id:
          type: integer
      required:
        - success
        - message
        - order_id
    ProductWithCycles:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        cycles:
          type: array
          items:
            type: string
      required:
        - name
        - cycles
    AvailableCountResponse:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
        amount:
          type: integer
      required:
        - country
        - product
        - amount
    ApiMeResponse:
      type: object
      properties:
        email:
          type: string
        active_orders:
          type: integer
        wallet_balance:
          type: integer
          description: 以美分为单位
      required:
        - email
        - active_orders
        - wallet_balance
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AvailableCountRequest:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
      required:
        - country
        - product
    AddBandwidthRequest:
      type: object
      properties:
        amount:
          type: integer
          description: 容量（GB，1 GB = 1 073 741 824 字节），最多 100 000
        promo_code:
          type: string
          nullable: true
      required:
        - amount
    GetSubUsersRequest:
      type: object
      properties:
        offset:
          type: integer
          description: 偏移量（默认 0）
        limit:
          type: integer
          description: 页面大小（默认 20）
    EditSubUserPayload:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateSubUserPayload:
      type: object
      description: 必须提供 `data` 或 `data_bytes`；两者都提供时以 `data_bytes` 为准。
      properties:
        proxy_type:
          type: string
        name:
          type: string
        data:
          type: integer
          description: 容量（GB，1 GB = 1 073 741 824 字节），最多 100 000
        data_bytes:
          type: integer
          format: int64
          description: 容量（字节，精确值；优先于 `data`），最多 100 000 GB
      required:
        - proxy_type
        - name
    ChangeSubUserPasswordPayload:
      type: object
      properties:
        proxy_type:
          type: string
      required:
        - proxy_type
    ModifyTrafficPayload:
      type: object
      description: 必须提供 `data` 或 `data_bytes`；两者都提供时以 `data_bytes` 为准。
      properties:
        proxy_type:
          type: string
        data:
          type: integer
          description: 容量（GB，1 GB = 1 073 741 824 字节），最多 100 000
        data_bytes:
          type: integer
          format: int64
          description: 容量（字节，精确值；优先于 `data`），最多 100 000 GB
      required:
        - proxy_type
    AnalyticsSeries:
      type: object
      description: |
        提供商的原始响应，不做修改。其结构取决于 `kind`：
        * `overall`：`results` 为时间区间 `{timestamp, data, requests}`，空区间以 0 返回；短时间窗按小时，长时间窗按天；
        * `domains`：`results` 为主机 `{hostname, data, requests}`，按 `data` 降序排列；没有 `count`；
        * `connections`：`results` 为当前打开的连接 `{user_id, package_id, server_ip, connections}`；没有时间段（`timezone`、`start`、`end`）。
      properties:
        count:
          type: integer
          description: 结果总数（`overall`）
        next:
          type: string
          nullable: true
          description: 下一页链接
        previous:
          type: string
          nullable: true
          description: 上一页链接
        timezone:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                description: 区间开始时间（`overall`）
              hostname:
                type: string
                description: 目标主机（`domains`）
              data:
                type: integer
                format: int64
                description: 字节数（`overall`、`domains`）
              requests:
                type: integer
                description: 请求数（`overall`、`domains`）
              user_id:
                type: string
                description: 账户或子用户 ID（`connections`）
              package_id:
                type: string
                description: 套餐 ID（`connections`）
              server_ip:
                type: string
                description: 持有这些连接的网关 IP（`connections`）
              connections:
                type: integer
                description: 打开的连接数（`connections`）
    SubUserOrderState:
      type: object
      nullable: true
      description: 操作之后的子用户配额状态（提供商未返回订单对象时为 null）
      properties:
        proxy_password:
          type: string
        data:
          type: integer
          format: int64
          description: 已分配的配额（字节）
        data_spent:
          type: integer
          format: int64
          description: 已用字节数
        data_remain:
          type: integer
          format: int64
          description: 剩余字节数（超额使用时可能为负）
    Country:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: ISO国家代码
        name:
          type: string
          maxLength: 255
          description: 国家名称
      required:
        - code
        - name
    Region:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: 地区代码（州/省代码）
        name:
          type: string
          maxLength: 255
          description: 地区名称（州/省名称）
        country:
          $ref: '#/components/schemas/Country'
      required:
        - code
        - name
        - country
    City:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: 城市代码（通常为 slug 格式）
        name:
          type: string
          maxLength: 255
          description: 城市名称
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              maxLength: 10
              description: 地区代码
            name:
              type: string
              maxLength: 255
              description: 地区名称
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedCountriesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
        - count
        - results
    PagedRegionsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Region'
      required:
        - count
        - results
    PagedCitiesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
        - count
        - results
    Isp:
      type: object
      properties:
        code:
          type: string
          description: "ISP 代码，通常是一个 slug"
        name:
          type: string
          description: "互联网服务提供商名称"
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              description: "地区代码"
            name:
              type: string
              description: "地区名称"
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedIspsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Isp'
      required:
        - count
        - results
    CreateOrderAddonRequest:
      type: object
      properties:
        addon_key:
          type: string
          example: p0f_slots
        qty:
          type: integer
          minimum: 1
      required:
        - addon_key
        - qty
paths:
  /user/api/proxies/active:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: 获取订单中的活动代理
      parameters:
        - in: query
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 代理列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveProxyItem'
                  order_tag:
                    type: string
                    nullable: true
                required:
                  - success
                  - data
        '400':
          description: 订单尚无代理凭据（`Missing authtoken in order`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 此订单无法使用该方法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /user/api/orders/{order_id}/del-np/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "设置按 IP 删除 (del-np)"
      description: |
        仅适用于数据中心和 ISP 代理。
        标记的代理在已付费周期结束前继续工作，并在下次续订时删除。订单的 `quantity` 和 `price_paid` 现在不会改变：续订时按剩余代理收费（订单价格的相应比例），然后再更新这两个字段。见 GET /user/api/orders/{order_id} 中的 `renewal_quantity` 和 `renewal_price`。
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      ip:
                        type: string
                      value:
                        type: boolean
                    required:
                      - ip
                      - value
              required:
                - items
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: "验证错误/不是 DC-ISP/keep=0"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/signature/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "设置 IP 操作系统指纹"
      description: "为一个或多个代理 IP 设置操作系统指纹签名。  \n订单必须启用 `p0f_slots` 组件。\n\n每个设置了签名的 IP 会永久占用一个槽位。修改已有签名 IP 的操作系统值不会占用额外槽位。\n\n**可用的签名值：**\n\n| 值 | 操作系统 |\n| --- | --- |\n| `ios` | iOS |\n| `macos` | macOS |\n| `android` | Android |\n| `linux` | Linux |\n| `win10` | Windows 10 |\n| `win11` | Windows 11 |"
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - ip
                      - signature
                    properties:
                      ip:
                        type: string
                      signature:
                        type: string
                        description: "要欺骗的操作系统标识符。"
                        enum:
                          - ios
                          - macos
                          - android
                          - linux
                          - win10
                          - win11
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  updated:
                    type: integer
                    description: "更新的IP数量"
        '400':
          description: "验证错误或插槽不足"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/calculate:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: "计算附加成本"
      description: "返回为活动数据中心/ISP 订单购买给定附加组件的额外单位的价格预览。目前唯一支持的附加密钥是 `p0f_slots`；操作系统指纹签名槽。"
      parameters:
        - in: path
          name: order_id
          required: true
          description: "订单号"
          schema:
            type: integer
        - in: query
          name: addon_key
          required: true
          description: "附加标识符（例如 `p0f_slots`）"
          schema:
            type: string
        - in: query
          name: add_qty
          required: true
          description: "要添加的单位数量"
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "价格预览"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  addon_key:
                    type: string
                  catalog_id:
                    type: integer
                  price_per_unit:
                    type: integer
                    description: "每单位价格（美分）"
                  current_qty:
                    type: integer
                  add_qty:
                    type: integer
                  new_qty:
                    type: integer
                  add_total:
                    type: integer
                    description: "本次购买的总费用（以美分为单位）"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/purchase:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "购买附加组件"
      description: |
        立即从钱包扣款，并将指定数量的组件添加到订单。订单状态必须为 **active**。目前只有 `p0f_slots` 可用。
        请发送 `Idempotency-Key` 标头，确保重试安全（会扣款）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: order_id
          required: true
          description: "订单号"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - add_qty
              properties:
                addon_key:
                  type: string
                add_qty:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: "已购买附加组件"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons_price_paid:
                    type: integer
                    description: "该订单的累计附加成本（分）"
                  addons:
                    type: array
                    description: "订单中存储的更新附加列表"
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 该订单的组件同时发生了另一项更改（请重试），或使用此 Idempotency-Key 的请求仍在执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "安排附加降级"
      description: "安排组件在下一个续订周期 **降级**。新数量必须低于当前数量。更改保存为 `pending` 标记，并在订单续订时自动应用。"
      parameters:
        - in: path
          name: order_id
          required: true
          description: "订单号"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - action
              properties:
                addon_key:
                  type: string
                action:
                  type: string
                  description: '`downgrade`：下次续订时减少数量；`cancel`：下次续订时移除该组件'
                  enum:
                    - downgrade
                    - cancel
                next_qty:
                  type: integer
                  description: '`downgrade` 时必填：续订后的数量，须小于当前数量（0 表示移除全部单位）'
                  minimum: 0
      responses:
        '200':
          description: "已安排降级"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 订单不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule/cancel:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "取消已安排的降级"
      description: "取消通过 schedule 接口设置的待处理降级。"
      parameters:
        - in: path
          name: order_id
          required: true
          description: "订单号"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
              properties:
                addon_key:
                  type: string
      responses:
        '200':
          description: "待降级已清除"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/purchase:
    post:
      tags:
        - General
      summary: 创建订单并付款
      description: |
        按产品名称、地点和周期购买。
        数据中心/ISP 必须提供 location。
        标准住宅代理（Standart Residential Proxy）无需 location。

        请发送 `Idempotency-Key` 标头以确保重试安全：否则超时后的重试可能会重复扣款并重复发放代理。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PurchaseRequestDcIsp'
                - $ref: '#/components/schemas/PurchaseRequestResidentialStandard'
                - $ref: '#/components/schemas/PurchaseRequestResidentialPremium'
                - $ref: '#/components/schemas/PurchaseRequestResidentialUnmetered'
                - $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '200':
          description: 成功的
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: 验证/余额错误/库存不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未经授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 您的账户无法使用此计费周期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: 库存检查失败，或付款后未能发放代理；此时 `order_id` 和 `refunded` 表明款项是否已退回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /user/api/orders/calculate:
    get:
      tags:
        - General
      summary: "计算订单成本"
      description: "按产品名称、周期名称和数量计算价格。使用与购买相同的验证规则（允许的计费周期、促销规则）。"
      parameters:
        - in: query
          name: product
          required: true
          schema:
            type: string
        - in: query
          name: location
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: cycle
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: quantity
          required: false
          schema:
            type: integer
            nullable: true
        - in: query
          name: promo_code
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: addons_json
          required: false
          description: "URL 编码的 JSON 组件数组，例如 [{\"addon_key\":\"p0f_slots\",\"qty\":5}]"
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  original_price:
                    type: integer
                  final_price:
                    type: integer
                  discount_percent:
                    type: integer
                  addons_price:
                    type: integer
                    description: "附加组件总数，次要单位"
                  total_with_addons:
                    type: integer
                    description: "最终价格 + 插件价格"
        '400':
          description: "验证错误"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "未经授权"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 您的账户无法使用此计费周期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
