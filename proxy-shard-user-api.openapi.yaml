  /user/api/proxies/sub-user:
    post:
      tags:
        - Residential Proxies
      summary: 创建子用户
      description: |
        配额是在账户共享流量池之上的虚拟上限：分配配额不会从流量池扣除，只有子用户实际使用代理时才消耗流量。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: query
          name: proxy_type
          required: true
          description: 代理类型（standart | premium | unlimited）
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 必须提供 `data` 或 `data_bytes`；两者都提供时以 `data_bytes` 为准。
              properties:
                name:
                  type: string
                data:
                  type: integer
                  description: 容量（GB，1 GB = 1 073 741 824 字节），最多 100 000
                data_bytes:
                  type: integer
                  format: int64
                  description: 容量（字节，精确值；优先于 `data`），最多 100 000 GB
              required:
                - name
      responses:
        '200':
          description: 成功的
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        proxy_password:
                          type: string
                        data:
                          type: integer
                        data_spent:
                          type: integer
                        data_remain:
                          type: integer
                      required:
                        - user_id
                        - first_name
                        - proxy_password
                        - data
                        - data_spent
        '400':
          description: '校验错误，或提供商拒绝了请求（`rejected: true`）；未创建任何内容'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 使用此 Idempotency-Key 的请求仍在执行，或该键已用于不同的数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: 提供商不可达：结果未知；请使用同一个 Idempotency-Key 重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
